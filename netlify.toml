# Doxan sur Netlify : frontend (Expo web) + API (Netlify Function). Zéro Railway.
[build]
  command = "cd mobile && npm install && npx expo export -p web"
  publish = "mobile/dist"
  functions = "netlify/functions"

# /api/* -> la fonction (doit passer AVANT le fallback SPA)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# /admin -> back-office (avant le fallback SPA)
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin"
  status = 200

# Routage SPA : le reste retombe sur l'app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
